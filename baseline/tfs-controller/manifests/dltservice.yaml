apiVersion: v1
kind: ConfigMap
metadata:
  name: dlt-config
data:
  CHANNEL_NAME: tfs_channel
  CHAINCODE_NAME: tfs_dlt
  MSP_ID: ETSI
  PEER_ENDPOINT: 127.0.0.1:7051
  PEER_HOST_ALIAS: peer0.org1.tfs.etsi.org
  KEY_DIRECTORY_PATH: /etc/hyperledger/fabric-keystore/keystore
  CERT_DIRECTORY_PATH: /etc/hyperledger/fabric-signcerts/signcerts.pem
  TLS_CERT_PATH: /etc/hyperledger/fabric-ca-crt/ca.crt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dltservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dltservice
  template:
    metadata:
      labels:
        app: dltservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: connector
        image: ${_CUSTOMER_REGISTRY}/dlt-connector:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        - containerPort: 9192
        env:
        - name: LOG_LEVEL
          value: INFO
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      - name: gateway
        image: ${_CUSTOMER_REGISTRY}/dlt-gateway:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
        resources:
          requests:
            cpu: 200m
            memory: 1024Mi
          limits:
            cpu: 700m
            memory: 1024Mi
        volumeMounts:
        - name: keystore
          mountPath: /etc/hyperledger/fabric-keystore
          readOnly: true
        - name: signcerts
          mountPath: /etc/hyperledger/fabric-signcerts
          readOnly: true
        - name: ca-crt
          mountPath: /etc/hyperledger/fabric-ca-crt
          readOnly: true
        envFrom:
        - configMapRef:
            name: dlt-config
        env:
        - name: KEY_DIRECTORY_PATH
          value: /etc/hyperledger/fabric-keystore/keystore
        - name: CERT_DIRECTORY_PATH
          value: /etc/hyperledger/fabric-signcerts/signcerts.pem
        - name: TLS_CERT_PATH
          value: /etc/hyperledger/fabric-ca-crt/ca.crt
      volumes:
      - name: keystore
        secret:
          secretName: dlt-keystone
      - name: signcerts
        secret:
          secretName: dlt-signcerts
      - name: ca-crt
        secret:
          secretName: dlt-ca-crt
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: gatewayservice
spec:
  selector:
    app: dltservice
  ports:
  - protocol: TCP
    port: 50051
    targetPort: 50051
    nodePort: 32001
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: dltservice
  labels:
    app: dltservice
spec:
  type: ClusterIP
  selector:
    app: dltservice
  ports:
  - name: grpc
    protocol: TCP
    port: 8080
    targetPort: 8080
  - name: metrics
    protocol: TCP
    port: 9192
    targetPort: 9192
