apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetryservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telemetryservice
  template:
    metadata:
      labels:
        app: telemetryservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: frontend
        image: ${_CUSTOMER_REGISTRY}/telemetry-frontend:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 30050
        - containerPort: 9192
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: CRDB_DATABASE
          value: tfs_telemetry
        - name: CRDB_NAMESPACE
          value: sovereign-genesis
        - name: CRDB_SQL_PORT
          value: '26257'
        - name: CRDB_HOST
          value: cockroachdb-public
        - name: CRDB_SSLMODE
          value: disable
        - name: METRICS_PORT
          value: '9192'
        envFrom:
        - secretRef:
            name: crdb-data
        - secretRef:
            name: kfk-kpi-data
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      - name: backend
        image: ${_CUSTOMER_REGISTRY}/telemetry-backend:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 30060
        - containerPort: 9193
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: METRICS_PORT
          value: '9193'
        - name: CRDB_DATABASE
          value: tfs_telemetry
        - name: CRDB_NAMESPACE
          value: sovereign-genesis
        - name: CRDB_SQL_PORT
          value: '26257'
        - name: CRDB_HOST
          value: cockroachdb-public
        - name: CRDB_SSLMODE
          value: disable
        envFrom:
        - secretRef:
            name: crdb-data
        - secretRef:
            name: kfk-kpi-data
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryservice
  labels:
    app: telemetryservice
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: telemetryservice
  ports:
  - name: grpc
    protocol: TCP
    port: 30050
    targetPort: 30050
  - name: grpc-backend
    protocol: TCP
    port: 30060
    targetPort: 30060
  - name: metrics-frontend
    protocol: TCP
    port: 9192
    targetPort: 9192
  - name: metrics-backend
    protocol: TCP
    port: 9193
    targetPort: 9193
---
apiVersion: v1
kind: Service
metadata:
  name: telemetryservice-udp
  labels:
    app: telemetryservice
spec:
  type: ClusterIP
  selector:
    app: telemetryservice
  ports:
  - name: dnsudp
    protocol: UDP
    port: 12345
    targetPort: 12345
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telemetryservice-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telemetryservice
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
