rbac:
  create: true
  pspEnabled: false
  pspUseAppArmor: false
  namespaced: false
serviceAccount:
  create: true
  name: null
  nameTest: null
  automountServiceAccountToken: false
replicas: 1
headlessService: false
automountServiceAccountToken: true
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPU: '60'
  targetMemory: ''
  behavior: {}
deploymentStrategy:
  type: RollingUpdate
readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 60
  timeoutSeconds: 30
  failureThreshold: 10
image:
  registry: docker.io
  repository: grafana/grafana
  tag: ''
  sha: ''
  pullPolicy: IfNotPresent
  pullSecrets: []
testFramework:
  enabled: true
  image:
    registry: docker.io
    repository: bats/bats
    tag: v1.4.1
  imagePullPolicy: IfNotPresent
dnsPolicy: null
dnsConfig: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault
createConfigmap: true
downloadDashboardsImage:
  registry: docker.io
  repository: curlimages/curl
  tag: 8.9.1
  sha: ''
  pullPolicy: IfNotPresent
downloadDashboards:
  env: {}
  envFromSecret: ''
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  envValueFrom: {}
podPortName: grafana
gossipPortName: gossip
service:
  enabled: true
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080
  portName: service
persistence:
  type: pvc
  enabled: true
  accessModes:
  - ReadWriteOnce
  size: 10Gi
  finalizers:
  - kubernetes.io/pvc-protection
  disableWarning: false
  lookupVolumeName: true
adminUser: admin
admin:
  existingSecret: ''
  userKey: admin-user
  passwordKey: admin-password
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://mon-prometheus-server.monitoring.svc.cluster.local
      access: proxy
      isDefault: true
    - name: Mimir
      type: prometheus
      url: http://mon-mimir-gateway.monitoring.svc.cluster.local/prometheus
      access: proxy
      isDefault: false
grafana.ini:
  paths:
    data: /var/lib/grafana/
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
  analytics:
    check_for_updates: true
  log:
    mode: console
  grafana_net:
    url: https://grafana.net
  server:
    domain: '{{ if (and .Values.ingress.enabled .Values.ingress.hosts) }}{{ tpl (.Values.ingress.hosts
      | first) . }}{{ else }}''''{{ end }}'
revisionHistoryLimit: 5
assertNoLeakedSecrets: true
