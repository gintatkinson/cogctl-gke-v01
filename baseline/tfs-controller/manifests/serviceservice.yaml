apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: serviceservice
  template:
    metadata:
      labels:
        app: serviceservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: ${_CUSTOMER_REGISTRY}/service:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 3030
        - containerPort: 9192
        env:
        - name: LOG_LEVEL
          value: INFO
        startupProbe:
          grpc:
            port: 3030
          failureThreshold: 5
          periodSeconds: 1
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: serviceservice
  labels:
    app: serviceservice
spec:
  type: ClusterIP
  selector:
    app: serviceservice
  ports:
  - name: grpc
    protocol: TCP
    port: 3030
    targetPort: 3030
  - name: metrics
    protocol: TCP
    port: 9192
    targetPort: 9192
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: serviceservice-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: serviceservice
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
