apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztp-server-service
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ztp-server-service
  template:
    metadata:
      labels:
        app: ztp-server-service
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: ${_CUSTOMER_REGISTRY}/ztp_server:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        - containerPort: 5051
        - containerPort: 9192
        env:
        - name: LOG_LEVEL
          value: INFO
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: ztp-server-service
  labels:
    app: ztp-server-service
spec:
  type: ClusterIP
  selector:
    app: ztp-server-service
  ports:
  - name: http
    protocol: TCP
    port: 8005
    targetPort: 8005
  - name: grpc
    protocol: TCP
    port: 5051
    targetPort: 5051
  - name: metrics
    protocol: TCP
    port: 9192
    targetPort: 9192
