apiVersion: apps/v1
kind: Deployment
metadata:
  name: opticalattackdetectorservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opticalattackdetectorservice
  template:
    metadata:
      labels:
        app: opticalattackdetectorservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: ${_CUSTOMER_REGISTRY}/opticalattackdetector:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 10006
        - containerPort: 9192
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: opticalattackdetectorservice
  labels:
    app: opticalattackdetectorservice
spec:
  type: ClusterIP
  selector:
    app: opticalattackdetectorservice
  ports:
  - name: grpc
    port: 10006
    targetPort: 10006
  - name: metrics
    port: 9192
    targetPort: 9192
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opticalattackdetectorservice-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opticalattackdetectorservice
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
