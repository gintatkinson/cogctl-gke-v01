apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generatorservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: load-generatorservice
  replicas: 1
  template:
    metadata:
      labels:
        app: load-generatorservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: ${_CUSTOMER_REGISTRY}/load_generator:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 50052
        - containerPort: 9192
        env:
        - name: LOG_LEVEL
          value: INFO
        resources:
          requests:
            cpu: 256m
            memory: 128Mi
          limits:
            cpu: 512m
            memory: 128Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: load-generatorservice
  labels:
    app: load-generatorservice
spec:
  type: ClusterIP
  selector:
    app: load-generatorservice
  ports:
  - name: grpc
    protocol: TCP
    port: 50052
    targetPort: 50052
  - name: metrics
    protocol: TCP
    port: 9192
    targetPort: 9192
