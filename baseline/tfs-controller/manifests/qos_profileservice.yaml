apiVersion: apps/v1
kind: Deployment
metadata:
  name: qos-profileservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qos-profileservice
  template:
    metadata:
      annotations:
        config.linkerd.io/skip-outbound-ports: '4222'
      labels:
        app: qos-profileservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: ${_CUSTOMER_REGISTRY}/qos_profile:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 20040
        - containerPort: 9192
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: CRDB_DATABASE
          value: tfs_qos_profile
        - name: CRDB_NAMESPACE
          value: sovereign-genesis
        - name: CRDB_SQL_PORT
          value: '26257'
        envFrom:
        - secretRef:
            name: crdb-data
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: qos-profileservice
  labels:
    app: qos-profileservice
spec:
  type: ClusterIP
  selector:
    app: qos-profileservice
  ports:
  - name: grpc
    protocol: TCP
    port: 20040
    targetPort: 20040
  - name: metrics
    protocol: TCP
    port: 9192
    targetPort: 9192
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qos-profileservice-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qos-profileservice
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
