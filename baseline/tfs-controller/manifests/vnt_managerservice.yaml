apiVersion: apps/v1
kind: Deployment
metadata:
  name: vnt-managerservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vnt-managerservice
  replicas: 1
  template:
    metadata:
      labels:
        app: vnt-managerservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: ${_CUSTOMER_REGISTRY}/vnt-manager:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 10080
        - containerPort: 9192
        env:
        - name: LOG_LEVEL
          value: INFO
        envFrom:
        - secretRef:
            name: kfk-kpi-data
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: vnt-managerservice
  labels:
    app: vnt-managerservice
spec:
  type: ClusterIP
  selector:
    app: vnt-managerservice
  ports:
  - name: grpc
    port: 10080
    targetPort: 10080
  - name: metrics
    port: 9192
    targetPort: 9192
