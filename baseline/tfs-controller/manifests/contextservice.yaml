apiVersion: apps/v1
kind: Deployment
metadata:
  name: contextservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: contextservice
  template:
    metadata:
      annotations:
        config.linkerd.io/skip-outbound-ports: '4222'
      labels:
        app: contextservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: ${_CUSTOMER_REGISTRY}/context:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 1010
        - containerPort: 9192
        env:
        - name: MB_BACKEND
          value: nats
        - name: NATS_URI
          value: nats://nats:4222
        - name: NATS_NAMESPACE
          value: sovereign-genesis
        - name: NATS_CLIENT_PORT
          value: '4222'
        - name: NATS_HOST
          value: nats
        - name: NATS_PORT
          value: '4222'
        - name: LOG_LEVEL
          value: INFO
        - name: ALLOW_EXPLICIT_ADD_DEVICE_TO_TOPOLOGY
          value: 'FALSE'
        - name: ALLOW_EXPLICIT_ADD_LINK_TO_TOPOLOGY
          value: 'FALSE'
        - name: CRDB_DATABASE
          value: tfs_context
        - name: CRDB_HOST
          value: cockroachdb-public
        - name: CRDB_SQL_PORT
          value: '26257'
        - name: CRDB_SSLMODE
          value: disable
        - name: ALLOW_EXPLICIT_ADD_DEVICE_TO_TOPOLOGY
          value: 'TRUE'
        - name: ALLOW_EXPLICIT_ADD_LINK_TO_TOPOLOGY
          value: 'TRUE'
        - name: CRDB_NAMESPACE
          value: sovereign-genesis
        envFrom:
        - secretRef:
            name: crdb-data
        - secretRef:
            name: nats-data
        startupProbe:
          grpc:
            port: 1010
          failureThreshold: 5
          periodSeconds: 1
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: contextservice
  labels:
    app: contextservice
spec:
  type: ClusterIP
  selector:
    app: contextservice
  ports:
  - name: grpc
    protocol: TCP
    port: 1010
    targetPort: 1010
  - name: metrics
    protocol: TCP
    port: 9192
    targetPort: 9192
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contextservice-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contextservice
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
