apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpi-value-writerservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kpi-value-writerservice
  template:
    metadata:
      annotations:
        config.linkerd.io/skip-outbound-ports: '4222'
      labels:
        app: kpi-value-writerservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: ${_CUSTOMER_REGISTRY}/kpi_value_writer:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 30030
        - containerPort: 9192
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: PUSHGATEWAY_URL
          value: http://mon-prometheus-prometheus-pushgateway.monitoring.svc.cluster.local:9091
        envFrom:
        - secretRef:
            name: kfk-kpi-data
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: kpi-value-writerservice
  labels:
    app: kpi-value-writerservice
spec:
  type: ClusterIP
  selector:
    app: kpi-value-writerservice
  ports:
  - name: grpc
    protocol: TCP
    port: 30030
    targetPort: 30030
  - name: metrics
    protocol: TCP
    port: 9192
    targetPort: 9192
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kpi-value-writerservice-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kpi-value-writerservice
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
