apiVersion: apps/v1
kind: Deployment
metadata:
  name: l3-distributedattackdetectorservice
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: l3-distributedattackdetectorservice
  template:
    metadata:
      labels:
        app: l3-distributedattackdetectorservice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: ${_CUSTOMER_REGISTRY}/l3_distributedattackdetector:rc13-verified
        imagePullPolicy: Always
        ports:
        - containerPort: 10000
        env:
        - name: LOG_LEVEL
          value: INFO
        resources:
          requests:
            cpu: 250m
            memory: 1024Mi
          limits:
            cpu: 700m
            memory: 1024Mi
      initContainers:
      - name: init-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cockroachdb-public 26257 && nc -z nats-client 4222; do echo
          "waiting for stateful dependencies..."; sleep 2; done;
---
apiVersion: v1
kind: Service
metadata:
  name: l3-distributedattackdetectorservice
spec:
  type: ClusterIP
  selector:
    app: l3-distributedattackdetectorservice
  ports:
  - name: grpc
    port: 10000
    targetPort: 10000
