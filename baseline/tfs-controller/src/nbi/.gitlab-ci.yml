build nbi:
  variables:
    IMAGE_NAME: nbi
    IMAGE_TAG: latest
  stage: build
  before_script:
  - docker image prune --force
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - docker buildx build -t "$IMAGE_NAME:$IMAGE_TAG" -f ./src/$IMAGE_NAME/Dockerfile
    .
  - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"
  - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"
  after_script:
  - docker image prune --force
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  - changes:
    - src/common/**/*.py
    - proto/*.proto
    - src/$IMAGE_NAME/**/*.{py,in,yml}
    - src/$IMAGE_NAME/Dockerfile
    - src/$IMAGE_NAME/tests/*.py
    - manifests/${IMAGE_NAME}service.yaml
    - .gitlab-ci.yml
unit_test nbi:
  variables:
    IMAGE_NAME: nbi
    IMAGE_TAG: latest
  stage: unit_test
  needs:
  - build nbi
  - build mock_tfs_nbi_dependencies
  before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  - docker ps -aq | xargs -r docker rm -f
  - "if docker network list | grep teraflowbridge; then\n  echo \"teraflowbridge is\
    \ already created\";\nelse\n  docker network create -d bridge teraflowbridge;\n\
    fi\n"
  - "if docker container ls | grep $IMAGE_NAME; then\n  docker rm -f $IMAGE_NAME;\n\
    else\n  echo \"$IMAGE_NAME image is not in the system\";\nfi\n"
  - "if docker container ls | grep kafka; then\n  docker rm -f kafka;\nelse\n  echo\
    \ \"Kafka container is not in the system\";\nfi\n"
  - docker container prune -f
  script:
  - docker pull "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"
  - docker pull "$CI_REGISTRY_IMAGE/mock_tfs_nbi_dependencies:test"
  - docker pull "bitnamilegacy/kafka:latest"
  - docker image prune --force
  - 'docker run --name kafka -d --network=teraflowbridge -p 9092:9092 -p 9093:9093
    --env KAFKA_CFG_NODE_ID=1 --env KAFKA_CFG_PROCESS_ROLES=controller,broker --env
    KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 --env KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    --env KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER --env KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
    bitnamilegacy/kafka:latest

    '
  - while ! docker logs kafka 2>&1 | grep -q 'Kafka Server started'; do sleep 1; done
  - sleep 5
  - KAFKA_IP=$(docker inspect kafka --format "{{.NetworkSettings.Networks.teraflowbridge.IPAddress}}")
  - echo $KAFKA_IP
  - 'docker run --name mock_tfs_nbi_dependencies -d -p 10000:10000 --network=teraflowbridge
    --env BIND_ADDRESS=0.0.0.0 --env BIND_PORT=10000 --env LOG_LEVEL=INFO $CI_REGISTRY_IMAGE/mock_tfs_nbi_dependencies:test

    '
  - 'docker run --name $IMAGE_NAME -d -v "$PWD/src/$IMAGE_NAME/tests:/opt/results"  --network=teraflowbridge
    --env LOG_LEVEL=DEBUG --env FLASK_ENV=development --env IETF_NETWORK_RENDERER=LIBYANG
    --env "KFK_SERVER_ADDRESS=${KAFKA_IP}:9092" $CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG

    '
  - (docker logs -f $IMAGE_NAME || true) 2>&1 | grep -m1 -Fi 'Initialization completed'
  - sleep 5
  - docker ps -a
  - docker logs kafka
  - docker logs mock_tfs_nbi_dependencies
  - docker logs $IMAGE_NAME
  - docker exec -i $IMAGE_NAME bash -c "coverage run --append -m pytest --log-level=INFO
    --verbose $IMAGE_NAME/tests/test_core.py --junitxml=/opt/results/${IMAGE_NAME}_report_core.xml"
  - docker exec -i $IMAGE_NAME bash -c "coverage run --append -m pytest --log-level=INFO
    --verbose $IMAGE_NAME/tests/test_tfs_api.py --junitxml=/opt/results/${IMAGE_NAME}_report_tfs_api.xml"
  - docker exec -i $IMAGE_NAME bash -c "coverage run --append -m pytest --log-level=INFO
    --verbose $IMAGE_NAME/tests/test_ietf_l2vpn.py --junitxml=/opt/results/${IMAGE_NAME}_report_ietf_l2vpn.xml"
  - docker exec -i $IMAGE_NAME bash -c "coverage run --append -m pytest --log-level=INFO
    --verbose $IMAGE_NAME/tests/test_ietf_network.py --junitxml=/opt/results/${IMAGE_NAME}_report_ietf_network.xml"
  - docker exec -i $IMAGE_NAME bash -c "coverage run --append -m pytest --log-level=INFO
    --verbose $IMAGE_NAME/tests/test_ietf_l3vpn.py --junitxml=/opt/results/${IMAGE_NAME}_report_ietf_l3vpn.xml"
  - docker exec -i $IMAGE_NAME bash -c "coverage run --append -m pytest --log-level=INFO
    --verbose $IMAGE_NAME/tests/test_etsi_bwm.py --junitxml=/opt/results/${IMAGE_NAME}_report_etsi_bwm.xml"
  - docker exec -i $IMAGE_NAME bash -c "coverage run --append -m pytest --log-level=INFO
    --verbose $IMAGE_NAME/tests/test_camara_qod.py --junitxml=/opt/results/${IMAGE_NAME}_report_camara_qod.xml"
  - docker exec -i $IMAGE_NAME bash -c "coverage report --include='${IMAGE_NAME}/*'
    --show-missing"
  coverage: /TOTAL\s+\d+\s+\d+\s+(\d+%)/
  after_script:
  - docker logs mock_tfs_nbi_dependencies
  - docker logs $IMAGE_NAME
  - docker logs kafka
  - docker rm -f mock_tfs_nbi_dependencies $IMAGE_NAME
  - docker rm -f kafka
  - docker network rm teraflowbridge
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  - changes:
    - src/common/**/*.py
    - proto/*.proto
    - src/$IMAGE_NAME/**/*.{py,in,yml}
    - src/$IMAGE_NAME/Dockerfile
    - src/$IMAGE_NAME/tests/*.py
    - manifests/${IMAGE_NAME}service.yaml
    - .gitlab-ci.yml
  artifacts:
    when: always
    reports:
      junit: src/$IMAGE_NAME/tests/${IMAGE_NAME}_report_*.xml
