build kpi-value-api:
  variables:
    IMAGE_NAME: kpi_value_api
    IMAGE_TAG: latest
  stage: build
  before_script:
  - docker image prune --force
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - docker buildx build -t "$IMAGE_NAME:$IMAGE_TAG" -f ./src/$IMAGE_NAME/Dockerfile
    .
  - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"
  - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"
  after_script:
  - docker image prune --force
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  - changes:
    - src/common/**/*.py
    - proto/*.proto
    - src/$IMAGE_NAME/**/*.{py,in,yml}
    - src/$IMAGE_NAME/Dockerfile
    - src/$IMAGE_NAME/tests/*.py
    - manifests/${IMAGE_NAME}service.yaml
    - .gitlab-ci.yml
unit_test kpi-value-api:
  variables:
    IMAGE_NAME: kpi_value_api
    IMAGE_TAG: latest
  stage: unit_test
  needs:
  - build kpi-value-api
  before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  - if docker network list | grep teraflowbridge; then echo "teraflowbridge is already
    created"; else docker network create -d bridge teraflowbridge; fi
  - if docker container ls | grep $IMAGE_NAME; then docker rm -f $IMAGE_NAME; else
    echo "$IMAGE_NAME container is not in the system"; fi
  - if docker container ls | grep kafka; then docker rm -f kafka; else echo "Kafka
    container is not in the system"; fi
  - docker container prune -f
  script:
  - docker pull "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"
  - docker pull "bitnamilegacy/kafka:latest"
  - 'docker run --name kafka -d --network=teraflowbridge -p 9092:9092 -p 9093:9093
    --env KAFKA_CFG_NODE_ID=1 --env KAFKA_CFG_PROCESS_ROLES=controller,broker --env
    KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 --env KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    --env KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER --env KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
    bitnamilegacy/kafka:latest

    '
  - while ! docker logs kafka 2>&1 | grep -q 'Kafka Server started'; do sleep 1; done
  - sleep 5
  - docker inspect kafka --format "{{.NetworkSettings.Networks}}"
  - KAFKA_IP=$(docker inspect kafka --format "{{.NetworkSettings.Networks.teraflowbridge.IPAddress}}")
  - echo $KAFKA_IP
  - 'docker run --name $IMAGE_NAME -d -p 30020:30020 --env "KFK_SERVER_ADDRESS=${KAFKA_IP}:9092"
    --volume "$PWD/src/$IMAGE_NAME/tests:/opt/results" --network=teraflowbridge  $CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG

    '
  - sleep 5
  - docker ps -a
  - docker logs kafka
  - docker logs $IMAGE_NAME
  - 'docker exec -i $IMAGE_NAME bash -c "coverage run -m pytest --log-level=INFO --verbose
    --junitxml=/opt/results/${IMAGE_NAME}_report.xml $IMAGE_NAME/tests/test_*.py"

    '
  - docker exec -i $IMAGE_NAME bash -c "coverage report --include='${IMAGE_NAME}/*'
    --show-missing"
  coverage: /TOTAL\s+\d+\s+\d+\s+(\d+%)/
  after_script:
  - docker ps -a
  - docker rm -f $IMAGE_NAME
  - docker rm -f kafka
  - docker network rm teraflowbridge
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  - changes:
    - src/common/**/*.py
    - proto/*.proto
    - src/$IMAGE_NAME/**/*.{py,in,yml}
    - src/$IMAGE_NAME/Dockerfile
    - src/$IMAGE_NAME/tests/*.py
    - manifests/${IMAGE_NAME}service.yaml
    - .gitlab-ci.yml
  artifacts:
    when: always
    reports:
      junit: src/$IMAGE_NAME/tests/${IMAGE_NAME}_report.xml
