build ryu-openflow:
  variables:
    TEST_NAME: ryu-openflow
    IMAGE_TAG: mr$CI_MERGE_REQUEST_IID
  stage: build
  before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  - docker ps -aq | xargs -r docker rm -f
  - containerlab destroy --all --cleanup || true
  script:
  - echo "CI_PIPELINE_SOURCE = $CI_PIPELINE_SOURCE"
  - echo "CI_MERGE_REQUEST_ID = $CI_MERGE_REQUEST_ID"
  - echo "CI_MERGE_REQUEST_IID = $CI_MERGE_REQUEST_IID"
  - docker buildx build -t "$CI_REGISTRY_IMAGE/${TEST_NAME}-ryu:${IMAGE_TAG}" -f ./src/tests/${TEST_NAME}/Ryu.Dockerfile
    .
  - docker push "$CI_REGISTRY_IMAGE/${TEST_NAME}-ryu:${IMAGE_TAG}"
  - docker buildx build -t "$CI_REGISTRY_IMAGE/${TEST_NAME}-test:${IMAGE_TAG}" -f
    ./src/tests/${TEST_NAME}/Test.Dockerfile .
  - docker push "$CI_REGISTRY_IMAGE/${TEST_NAME}-test:${IMAGE_TAG}"
  after_script:
  - docker images --filter="dangling=true" --quiet | xargs -r docker rmi
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  - changes:
    - src/common/**/*.py
    - proto/*.proto
    - src/tests/${TEST_NAME}/**/*.{py,in,sh,yml}
    - src/tests/${TEST_NAME}/Dockerfile
    - .gitlab-ci.yml
