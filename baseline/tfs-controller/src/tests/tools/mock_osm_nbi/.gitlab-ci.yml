build mock_osm_nbi:
  stage: build
  before_script:
  - docker image prune --force
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - docker buildx build -t "$CI_REGISTRY_IMAGE/mock-osm-nbi:test" -f ./src/tests/tools/mock_osm_nbi/Dockerfile
    ./src/tests/tools/mock_osm_nbi
  - docker push "$CI_REGISTRY_IMAGE/mock-osm-nbi:test"
  after_script:
  - docker image prune --force
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  - changes:
    - src/common/**/*.py
    - proto/*.proto
    - src/tests/tools/mock_osm_nbi/**/*.{py,in,yml,yaml,yang,sh,json}
    - src/tests/tools/mock_osm_nbi/Dockerfile
    - src/tests/.gitlab-ci.yml
    - src/osm_client/**/*.{py,in,yml}
    - src/osm_client/Dockerfile
    - src/osm_client/tests/*.py
    - .gitlab-ci.yml
