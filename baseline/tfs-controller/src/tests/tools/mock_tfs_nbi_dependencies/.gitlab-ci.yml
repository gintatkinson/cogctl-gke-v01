build mock_tfs_nbi_dependencies:
  stage: build
  before_script:
  - docker image prune --force
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - docker buildx build -t "$CI_REGISTRY_IMAGE/mock_tfs_nbi_dependencies:test" -f
    ./src/tests/tools/mock_tfs_nbi_dependencies/Dockerfile .
  - docker push "$CI_REGISTRY_IMAGE/mock_tfs_nbi_dependencies:test"
  after_script:
  - docker image prune --force
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  - changes:
    - src/common/**/*.py
    - proto/*.proto
    - src/src/tests/tools/mock_tfs_nbi_dependencies/**/*.{py,in,yml,yaml}
    - src/src/tests/tools/mock_tfs_nbi_dependencies/Dockerfile
    - src/nbi/**/*.{py,in,yml}
    - src/nbi/Dockerfile
    - src/nbi/tests/*.py
    - manifests/nbiservice.yaml
    - .gitlab-ci.yml
