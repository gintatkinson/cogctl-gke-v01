apiVersion: apps/v1
kind: Deployment
metadata:
  name: firewall-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firewall-agent
  template:
    metadata:
      labels:
        app: firewall-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: firewall-agent
        image: firewall-agent:dev
        imagePullPolicy: Always
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        ports:
        - containerPort: 8888
          hostPort: 8888
        readinessProbe:
          httpGet:
            path: /restconf/data
            port: 8888
          initialDelaySeconds: 5
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /restconf/data
            port: 8888
          initialDelaySeconds: 5
          timeoutSeconds: 1
