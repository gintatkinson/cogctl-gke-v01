services:
  firewall_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firewall-agent
    network_mode: host
    cap_add:
    - NET_ADMIN
    - NET_RAW
  public_server:
    image: python:3.11-slim
    container_name: public-server
    network_mode: host
    command:
    - python
    - -u
    - -m
    - http.server
    - '8001'
  corporate_server:
    image: python:3.11-slim
    container_name: corporate-server
    network_mode: host
    command:
    - python
    - -u
    - -m
    - http.server
    - '8002'
