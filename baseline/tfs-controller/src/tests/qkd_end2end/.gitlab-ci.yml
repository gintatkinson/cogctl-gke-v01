build qkd_end2end:
  variables:
    TEST_NAME: qkd_end2end
  stage: build
  before_script:
  - docker image prune --force
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - docker buildx build -t "${TEST_NAME}:latest" -f ./src/tests/${TEST_NAME}/Dockerfile
    .
  - docker tag "${TEST_NAME}:latest" "$CI_REGISTRY_IMAGE/${TEST_NAME}:latest"
  - docker push "$CI_REGISTRY_IMAGE/${TEST_NAME}:latest"
  after_script:
  - docker image prune --force
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  - changes:
    - src/common/**/*.py
    - proto/*.proto
    - src/tests/${TEST_NAME}/**/*.{py,in,sh,yml}
    - src/tests/${TEST_NAME}/Dockerfile
    - .gitlab-ci.yml
end2end_test qkd_end2end:
  timeout: 45m
  variables:
    TEST_NAME: qkd_end2end
  stage: end2end_test
  before_script:
  - docker ps --all --quiet | xargs --no-run-if-empty docker stop
  - docker container prune --force
  - docker ps --all --quiet | xargs --no-run-if-empty docker rm --force
  - docker image prune --force
  - docker network prune --force
  - docker volume prune --all --force
  - docker buildx prune --force
  - microk8s status --wait-ready
  - LOOP_MAX_ATTEMPTS=10
  - LOOP_COUNTER=0
  - "while ! kubectl get pods --all-namespaces &> /dev/null; do\n  printf \"%c\" \"\
    .\"\n  sleep 1\n  LOOP_COUNTER=$((LOOP_COUNTER + 1))\n  if [ \"$LOOP_COUNTER\"\
    \ -ge \"$LOOP_MAX_ATTEMPTS\" ]; then\n    echo \"Max attempts reached, exiting\
    \ the loop.\"\n    exit 1\n  fi\ndone\n"
  - kubectl get pods --all-namespaces
  - export K8S_NAMESPACES=$(kubectl get namespace -o jsonpath='{.items[*].metadata.name}')
  - echo "K8S_NAMESPACES=${K8S_NAMESPACES}"
  - export OLD_NATS_NAMESPACES=$(echo "${K8S_NAMESPACES}" | tr ' ' '\n' | grep -E
    '^nats')
  - echo "OLD_NATS_NAMESPACES=${OLD_NATS_NAMESPACES}"
  - "for ns in ${OLD_NATS_NAMESPACES}; do\n  if [[ \"$ns\" == nats* ]]; then\n   \
    \ if helm3 status \"$ns\" &>/dev/null; then\n      helm3 uninstall \"$ns\" -n\
    \ \"$ns\"\n    else\n      echo \"Release '$ns' not found, skipping...\"\n   \
    \ fi\n  fi\ndone\n"
  - export OLD_NAMESPACES=$(echo "${K8S_NAMESPACES}" | tr ' ' '\n' | grep -E '^(tfs|crdb|qdb|kafka|nats)')
  - echo "OLD_NAMESPACES=${OLD_NAMESPACES}"
  - kubectl delete namespace ${OLD_NAMESPACES} || true
  - 'kubectl get pods --all-namespaces --no-headers --field-selector=status.phase=Failed
    -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name | xargs --no-run-if-empty
    --max-args=2 kubectl delete pod --namespace

    '
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - docker pull "${CI_REGISTRY_IMAGE}/${TEST_NAME}:latest"
  - docker pull "${CI_REGISTRY_IMAGE}/mock-qkd-node:test"
  - docker network create --driver bridge --subnet=172.254.250.0/24 --gateway=172.254.250.254
    qkd-node-br
  - 'docker run --detach --name qkd-node-01 --network qkd-node-br --ip 172.254.250.101
    --publish 8080 --volume "$PWD/src/tests/${TEST_NAME}/data/qkd-node-01.json:/var/mock_qkd_node/startup.json"
    ${CI_REGISTRY_IMAGE}/mock-qkd-node:test

    '
  - 'docker run --detach --name qkd-node-02 --network qkd-node-br --ip 172.254.250.102
    --publish 8080 --volume "$PWD/src/tests/${TEST_NAME}/data/qkd-node-02.json:/var/mock_qkd_node/startup.json"
    ${CI_REGISTRY_IMAGE}/mock-qkd-node:test

    '
  - 'docker run --detach --name qkd-node-03 --network qkd-node-br --ip 172.254.250.103
    --publish 8080 --volume "$PWD/src/tests/${TEST_NAME}/data/qkd-node-03.json:/var/mock_qkd_node/startup.json"
    ${CI_REGISTRY_IMAGE}/mock-qkd-node:test

    '
  - docker ps -a
  - echo "Waiting for QKD Nodes to initialize..."
  - "while ! docker logs qkd-node-01 2>&1 | grep -q \"All log messages before absl::InitializeLog()\
    \ is called are written to STDERR\"; do\n  printf \"%c\" \".\"\n  sleep 1\ndone\n"
  - "while ! docker logs qkd-node-02 2>&1 | grep -q \"All log messages before absl::InitializeLog()\
    \ is called are written to STDERR\"; do\n  printf \"%c\" \".\"\n  sleep 1\ndone\n"
  - "while ! docker logs qkd-node-03 2>&1 | grep -q \"All log messages before absl::InitializeLog()\
    \ is called are written to STDERR\"; do\n  printf \"%c\" \".\"\n  sleep 1\ndone\n"
  - docker ps -a
  - docker logs qkd-node-01
  - docker logs qkd-node-02
  - docker logs qkd-node-03
  - echo "[QKD-NODE-01] Config initial:"
  - curl "http://172.254.250.101:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-02] Config initial:"
  - curl "http://172.254.250.102:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-03] Config initial:"
  - curl "http://172.254.250.103:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - microk8s status --wait-ready
  - LOOP_MAX_ATTEMPTS=10
  - LOOP_COUNTER=0
  - "while ! kubectl get pods --all-namespaces &> /dev/null; do\n  printf \"%c\" \"\
    .\"\n  sleep 1\n  LOOP_COUNTER=$((LOOP_COUNTER + 1))\n  if [ \"$LOOP_COUNTER\"\
    \ -ge \"$LOOP_MAX_ATTEMPTS\" ]; then\n    echo \"Max attempts reached, exiting\
    \ the loop.\"\n    exit 1\n  fi\ndone\n"
  - kubectl get pods --all-namespaces
  - source src/tests/${TEST_NAME}/deploy_specs.sh
  - ./deploy/crdb.sh
  - ./deploy/nats.sh
  - ./deploy/kafka.sh
  - ./deploy/tfs.sh
  - ./deploy/show.sh
  - kubectl --namespace $TFS_K8S_NAMESPACE logs deployment/contextservice -c server
  - 'docker run -t --rm --name ${TEST_NAME} --network=host  --volume "$PWD/tfs_runtime_env_vars.sh:/var/teraflow/tfs_runtime_env_vars.sh"
    --volume "$PWD/src/tests/${TEST_NAME}:/opt/results" $CI_REGISTRY_IMAGE/${TEST_NAME}:latest
    /var/teraflow/run-01-onboarding.sh

    '
  - 'docker run -t --rm --name ${TEST_NAME} --network=host  --volume "$PWD/tfs_runtime_env_vars.sh:/var/teraflow/tfs_runtime_env_vars.sh"
    --volume "$PWD/src/tests/${TEST_NAME}:/opt/results" $CI_REGISTRY_IMAGE/${TEST_NAME}:latest
    /var/teraflow/run-02-create-links.sh

    '
  - echo "[QKD-NODE-01] Config with links:"
  - curl "http://172.254.250.101:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-02] Config with links:"
  - curl "http://172.254.250.102:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-03] Config with links:"
  - curl "http://172.254.250.103:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - 'docker run -t --rm --name ${TEST_NAME} --network=host  --volume "$PWD/tfs_runtime_env_vars.sh:/var/teraflow/tfs_runtime_env_vars.sh"
    --volume "$PWD/src/tests/${TEST_NAME}:/opt/results" $CI_REGISTRY_IMAGE/${TEST_NAME}:latest
    /var/teraflow/run-03-create-external-app.sh

    '
  - echo "[QKD-NODE-01] Config with links and external app:"
  - curl "http://172.254.250.101:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-02] Config with links and external app:"
  - curl "http://172.254.250.102:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-03] Config with links and external app:"
  - curl "http://172.254.250.103:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - 'docker run -t --rm --name ${TEST_NAME} --network=host --volume "$PWD/tfs_runtime_env_vars.sh:/var/teraflow/tfs_runtime_env_vars.sh"
    --volume "$PWD/src/tests/${TEST_NAME}:/opt/results" $CI_REGISTRY_IMAGE/${TEST_NAME}:latest
    /var/teraflow/run-04-delete-external-app.sh

    '
  - echo "[QKD-NODE-01] Config with links and deleted external app:"
  - curl "http://172.254.250.101:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-02] Config with links and deleted external app:"
  - curl "http://172.254.250.102:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-03] Config with links and deleted external app:"
  - curl "http://172.254.250.103:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - 'docker run -t --rm --name ${TEST_NAME} --network=host  --volume "$PWD/tfs_runtime_env_vars.sh:/var/teraflow/tfs_runtime_env_vars.sh"
    --volume "$PWD/src/tests/${TEST_NAME}:/opt/results" $CI_REGISTRY_IMAGE/${TEST_NAME}:latest
    /var/teraflow/run-05-delete-links.sh

    '
  - echo "[QKD-NODE-01] Config with deleted links and deleted external app:"
  - curl "http://172.254.250.101:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-02] Config with deleted links and deleted external app:"
  - curl "http://172.254.250.102:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-03] Config with deleted links and deleted external app:"
  - curl "http://172.254.250.103:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - 'docker run -t --rm --name ${TEST_NAME} --network=host  --volume "$PWD/tfs_runtime_env_vars.sh:/var/teraflow/tfs_runtime_env_vars.sh"
    --volume "$PWD/src/tests/${TEST_NAME}:/opt/results" $CI_REGISTRY_IMAGE/${TEST_NAME}:latest
    /var/teraflow/run-06-cleanup.sh

    '
  after_script:
  - docker ps -a
  - docker logs qkd-node-01
  - docker logs qkd-node-02
  - docker logs qkd-node-03
  - echo "[QKD-NODE-01] Config after_script:"
  - curl "http://172.254.250.101:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-02] Config after_script:"
  - curl "http://172.254.250.102:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - echo "[QKD-NODE-03] Config after_script:"
  - curl "http://172.254.250.103:8080/restconf/data/etsi-qkd-sdn-node:"
  - echo
  - source src/tests/${TEST_NAME}/deploy_specs.sh
  - kubectl --namespace $TFS_K8S_NAMESPACE logs deployment/contextservice -c server
  - kubectl --namespace $TFS_K8S_NAMESPACE logs deployment/deviceservice -c server
  - kubectl --namespace $TFS_K8S_NAMESPACE logs deployment/pathcompservice -c frontend
  - kubectl --namespace $TFS_K8S_NAMESPACE logs deployment/serviceservice -c server
  - kubectl --namespace $TFS_K8S_NAMESPACE logs deployment/nbiservice -c server
  - kubectl --namespace $TFS_K8S_NAMESPACE logs deployment/qkd-appservice -c server
  - kubectl delete namespaces tfs || true
  - docker ps --all --quiet | xargs --no-run-if-empty docker stop
  - docker container prune --force
  - docker ps --all --quiet | xargs --no-run-if-empty docker rm --force
  - docker image prune --force
  - docker network prune --force
  - docker volume prune --all --force
  - docker buildx prune --force
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  artifacts:
    when: always
    reports:
      junit: ./src/tests/${TEST_NAME}/report_*.xml
