name: sns4sns-static
mgmt:
  network: mgmt-net
  ipv4-subnet: 172.20.20.0/24
  mtu: 1400
topology:
  kinds:
    arista_ceos:
      kind: arista_ceos
      image: ceos:4.31.2F
  nodes:
    r1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.101
      startup-config: r1-static.cfg
    r2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.102
      startup-config: r2-static.cfg
  links:
  - endpoints:
    - r1:eth2
    - r2:eth1
  - endpoints:
    - r1:eth10
    - macvlan:enp0s3
  - endpoints:
    - r2:eth10
    - macvlan:enp0s5
