build eucnc24:
  variables:
    TEST_NAME: eucnc24
  stage: build
  before_script:
  - docker image prune --force
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - docker buildx build -t "${TEST_NAME}:latest" -f ./src/tests/${TEST_NAME}/Dockerfile
    .
  - docker tag "${TEST_NAME}:latest" "$CI_REGISTRY_IMAGE/${TEST_NAME}:latest"
  - docker push "$CI_REGISTRY_IMAGE/${TEST_NAME}:latest"
  after_script:
  - docker image prune --force
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  - changes:
    - src/common/**/*.py
    - proto/*.proto
    - src/tests/${TEST_NAME}/**/*.{py,in,sh,yml}
    - src/tests/${TEST_NAME}/Dockerfile
    - .gitlab-ci.yml
end2end_test eucnc24:
  timeout: 45m
  variables:
    TEST_NAME: eucnc24
  stage: end2end_test
  before_script:
  - containerlab destroy --all --cleanup || true
  - docker ps --all --quiet | xargs --no-run-if-empty docker stop
  - docker container prune --force
  - docker ps --all --quiet | xargs --no-run-if-empty docker rm --force
  - docker image prune --force
  - docker network prune --force
  - docker volume prune --all --force
  - docker buildx prune --force
  - microk8s status --wait-ready
  - LOOP_MAX_ATTEMPTS=10
  - LOOP_COUNTER=0
  - "while ! kubectl get pods --all-namespaces &> /dev/null; do\n  printf \"%c\" \"\
    .\"\n  sleep 1\n  LOOP_COUNTER=$((LOOP_COUNTER + 1))\n  if [ \"$LOOP_COUNTER\"\
    \ -ge \"$LOOP_MAX_ATTEMPTS\" ]; then\n    echo \"Max attempts reached, exiting\
    \ the loop.\"\n    exit 1\n  fi\ndone\n"
  - kubectl get pods --all-namespaces
  - export K8S_NAMESPACES=$(kubectl get namespace -o jsonpath='{.items[*].metadata.name}')
  - echo "K8S_NAMESPACES=${K8S_NAMESPACES}"
  - export OLD_NATS_NAMESPACES=$(echo "${K8S_NAMESPACES}" | tr ' ' '\n' | grep -E
    '^nats')
  - echo "OLD_NATS_NAMESPACES=${OLD_NATS_NAMESPACES}"
  - "for ns in ${OLD_NATS_NAMESPACES}; do\n  if [[ \"$ns\" == nats* ]]; then\n   \
    \ if helm3 status \"$ns\" &>/dev/null; then\n      helm3 uninstall \"$ns\" -n\
    \ \"$ns\"\n    else\n      echo \"Release '$ns' not found, skipping...\"\n   \
    \ fi\n  fi\ndone\n"
  - export OLD_NAMESPACES=$(echo "${K8S_NAMESPACES}" | tr ' ' '\n' | grep -E '^(tfs|crdb|qdb|kafka|nats)')
  - echo "OLD_NAMESPACES=${OLD_NAMESPACES}"
  - kubectl delete namespace ${OLD_NAMESPACES} || true
  - 'kubectl get pods --all-namespaces --no-headers --field-selector=status.phase=Failed
    -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name | xargs --no-run-if-empty
    --max-args=2 kubectl delete pod --namespace

    '
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - docker pull "${CI_REGISTRY_IMAGE}/${TEST_NAME}:latest"
  - microk8s status --wait-ready
  - LOOP_MAX_ATTEMPTS=10
  - LOOP_COUNTER=0
  - "while ! kubectl get pods --all-namespaces &> /dev/null; do\n  printf \"%c\" \"\
    .\"\n  sleep 1\n  LOOP_COUNTER=$((LOOP_COUNTER + 1))\n  if [ \"$LOOP_COUNTER\"\
    \ -ge \"$LOOP_MAX_ATTEMPTS\" ]; then\n    echo \"Max attempts reached, exiting\
    \ the loop.\"\n    exit 1\n  fi\ndone\n"
  - kubectl get pods --all-namespaces
  - RUNNER_PATH=`pwd`
  - mkdir -p /tmp/clab/${TEST_NAME}
  - cp -R src/tests/${TEST_NAME}/clab/* /tmp/clab/${TEST_NAME}
  - tree -la /tmp/clab/${TEST_NAME}
  - cd /tmp/clab/${TEST_NAME}
  - containerlab deploy --reconfigure --topo eucnc24.clab.yml
  - cd $RUNNER_PATH
  - sleep 3
  - docker ps -a
  - containerlab exec --name eucnc24 --label clab-node-name=r1 --cmd "Cli --command
    \"enable"$'\n'$"show running-config\""
  - containerlab exec --name eucnc24 --label clab-node-name=r2 --cmd "Cli --command
    \"enable"$'\n'$"show running-config\""
  - containerlab exec --name eucnc24 --label clab-node-name=r3 --cmd "Cli --command
    \"enable"$'\n'$"show running-config\""
  - source src/tests/${TEST_NAME}/deploy_specs.sh
  - ./deploy/crdb.sh
  - ./deploy/nats.sh
  - ./deploy/kafka.sh
  - ./deploy/tfs.sh
  - ./deploy/show.sh
  - kubectl --namespace $TFS_K8S_NAMESPACE logs deployment/contextservice -c server
  - 'docker run -t --rm --name ${TEST_NAME} --network=host  --volume "$PWD/tfs_runtime_env_vars.sh:/var/teraflow/tfs_runtime_env_vars.sh"
    --volume "$PWD/src/tests/${TEST_NAME}:/opt/results" $CI_REGISTRY_IMAGE/${TEST_NAME}:latest
    /var/teraflow/run-onboarding.sh

    '
  - 'docker run -t --rm --name ${TEST_NAME} --network=host  --volume "$PWD/tfs_runtime_env_vars.sh:/var/teraflow/tfs_runtime_env_vars.sh"
    --volume "$PWD/src/tests/${TEST_NAME}:/opt/results" $CI_REGISTRY_IMAGE/${TEST_NAME}:latest
    /var/teraflow/run-service-tfs-create.sh

    '
  - containerlab exec --name eucnc24 --label clab-node-name=r1 --cmd "Cli --command
    \"enable"$'\n'$"show running-config\""
  - containerlab exec --name eucnc24 --label clab-node-name=r2 --cmd "Cli --command
    \"enable"$'\n'$"show running-config\""
  - containerlab exec --name eucnc24 --label clab-node-name=r3 --cmd "Cli --command
    \"enable"$'\n'$"show running-config\""
  - export TEST1_10=$(containerlab exec --name eucnc24 --label clab-node-name=dc1
    --cmd 'ping -n -c3 172.16.1.10' --format json)
  - echo $TEST1_10
  - echo $TEST1_10 | grep -E '3 packets transmitted, 3 received, 0\% packet loss'
  - export TEST1_1=$(containerlab exec --name eucnc24 --label clab-node-name=dc1 --cmd
    'ping -n -c3 172.16.1.1' --format json)
  - echo $TEST1_1
  - echo $TEST1_1 | grep -E '3 packets transmitted, 3 received, 0\% packet loss'
  - export TEST2_1=$(containerlab exec --name eucnc24 --label clab-node-name=dc1 --cmd
    'ping -n -c3 172.16.2.1' --format json)
  - echo $TEST2_1
  - echo $TEST2_1 | grep -E '3 packets transmitted, 3 received, 0\% packet loss'
  - export TEST2_10=$(containerlab exec --name eucnc24 --label clab-node-name=dc1
    --cmd 'ping -n -c3 172.16.2.10' --format json)
  - echo $TEST2_10
  - echo $TEST2_10 | grep -E '3 packets transmitted, 3 received, 0\% packet loss'
  - export TEST3_1=$(containerlab exec --name eucnc24 --label clab-node-name=dc1 --cmd
