steps:
- name: gcr.io/cloud-builders/docker
  id: build-core-services
  entrypoint: bash
  args:
  - -c
  - "SERVICES=(\n  \"automation\" \"context\" \"device\" \"dlt\" \"kpi_manager\" \n\
    \  \"monitoring\" \"nbi\" \"pathcomp\" \"policy\" \"service\" \n  \"slice\" \"\
    webui\"\n)\n\nREGISTRY=\"$_REGION-docker.pkg.dev/cogctl-gke-v01/sovereign-tfs\"\
    \nTAG=\"v3.0.0-sovereign-$(date +%s)\"\n\necho \"[SOVEREIGN] Starting Multi-Binary\
    \ Build from Source...\"\n\n# We build from the /baseline/tfs-controller directory\n\
    cd baseline/tfs-controller/\n\nfor SERVICE in \"$${SERVICES[@]}\"; do\n  echo\
    \ \"Building $${SERVICE}...\"\n  TARGET=\"$${REGISTRY}/$${SERVICE}:$${TAG}\"\n\
    \  \n  # Use the specific Dockerfile for each service\n  docker build -t $${TARGET}\
    \ -f src/$${SERVICE}/Dockerfile .\n  \n  echo \"Pushing $${SERVICE} to Vault...\"\
    \n  docker push $${TARGET}\n  \n  # Archive a 'stable' tag for the re-ignition\n\
    \  docker tag $${TARGET} \"$${REGISTRY}/$${SERVICE}:v3.0.0-stable\"\n  docker\
    \ push \"$${REGISTRY}/$${SERVICE}:v3.0.0-stable\"\ndone\n"
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  env:
  - DOCKER_BUILDKIT=1
