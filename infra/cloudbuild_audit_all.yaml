steps:
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
  - -c
  - "set -e\necho \"[AUDIT] Authenticating to Cluster: $_CLUSTER_NAME...\"\ngcloud\
    \ container clusters get-credentials \"$_CLUSTER_NAME\" --region \"$_REGION\"\n\
    \necho \"[AUDIT] Infrastructure Health (Nodes)...\"\nkubectl get nodes -o wide\n\
    \necho \"[AUDIT] Namespace Inventory...\"\nkubectl get namespaces\n\necho \"[AUDIT]\
    \ POD FORENSICS (All Namespaces)...\"\nkubectl get pods -A\n\necho \"[AUDIT] SERVICE\
    \ INVENTORY...\"\nkubectl get svc -A\n\necho \"[AUDIT] INGRESS BACKEND HEALTH...\"\
    \n# Describe ingress to check for backend health from GKE perspective\nkubectl\
    \ describe ingress -A\n\necho \"[AUDIT] CORE LOG ANALYSIS (Checking for Silent\
    \ Failures)...\"\nCOMPONENTS=(\"context\" \"device\" \"service\" \"slice\" \"\
    pathcomp\" \"nbi\" \"webui\" \"monitoring\" \"automation\")\nfor COMP in \"$${COMPONENTS[@]}\"\
    ; do\n  echo \"--- Logs for $${COMP}service ---\"\n  kubectl logs --tail=50 -l\
    \ app=$${COMP}service --all-containers=true || echo \"No logs found for $${COMP}service\"\
    \ndone\n\necho \"[AUDIT] CONNECTIVITY VERIFICATION (Public Endpoint)...\"\n# Try\
    \ to curl the ingress IP to verify perimeter access\nINGRESS_IP=$$(kubectl get\
    \ ingress tfs-ingress-opt -o jsonpath='{.status.loadBalancer.ingress[0].ip}' ||\
    \ echo \"$_INGRESS_IP_FALLBACK\")\necho \"Testing Connectivity to: $$INGRESS_IP\"\
    \ncurl -Ivvv -m 10 http://$$INGRESS_IP || echo \"Connectivity Check FAILED (Timeout\
    \ or Connection Refused)\"\n\necho \"[AUDIT] Audit Complete.\"\n"
substitutions:
  _CLUSTER_NAME: REPLACE_ME
  _REGION: us-central1
  _INGRESS_IP_FALLBACK: REPLACE_ME
