steps:
- name: gcr.io/cloud-builders/docker
  args:
  - build
  - -t
  - ${_TARGET_REGION}-docker.pkg.dev/${PROJECT_ID}/sovereign-tfs/python-base:rc13-verified
  - -f
  - baseline/tfs-controller/src/common/Dockerfile.base
  - .
images:
- ${_TARGET_REGION}-docker.pkg.dev/${PROJECT_ID}/sovereign-tfs/python-base:rc13-verified
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
