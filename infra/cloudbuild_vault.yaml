steps:
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
  - -c
  - "set -e\n# 1. Fetch GitLab PAT (Secret Manager -> K8s)\necho \"[VAULT] Fetching\
    \ ETSI_GITLAB_PAT...\"\nGITLAB_PAT=$(gcloud secrets versions access latest --secret=\"\
    ETSI_GITLAB_PAT\")\n\n# 2. Authenticate to GKE\necho \"[VAULT] Authenticating\
    \ to cluster: $_CLUSTER_NAME...\"\ngcloud container clusters get-credentials $_CLUSTER_NAME\
    \ --region $_REGION\n\n# 3. Secure Registry Credentials\necho \"[VAULT] Syncing\
    \ registry secrets...\"\nkubectl create secret generic tfs-gitlab-auth --from-literal=token=\"\
    $$GITLAB_PAT\" --dry-run=client -o yaml | kubectl apply -f -\n\n# 4. Generate\
    \ & Secure Infrastructure Credentials\necho \"[VAULT] Generating infrastructure\
    \ secrets...\"\nDB_PASS=$(openssl rand -base64 32)\nKC_ADMIN_PASS=$(openssl rand\
    \ -base64 32)\n\nkubectl create secret generic tfs-database-creds --from-literal=password=\"\
    $$DB_PASS\" --dry-run=client -o yaml | kubectl apply -f -\nkubectl create secret\
    \ generic tfs-keycloak-creds --from-literal=admin-password=\"$$KC_ADMIN_PASS\"\
    \ --dry-run=client -o yaml | kubectl apply -f -\n\n# 5. Recovery of Metadata Secrets\n\
    echo \"[VAULT] Restoring metadata secrets...\"\n# CRDB / QDB Alias Alignment\n\
    kubectl create secret generic qdb-data \\\n  --from-literal=username=admin \\\n\
    \  --from-literal=password=quest \\\n  --from-literal=METRICSDB_USER=admin \\\n\
    \  --from-literal=METRICSDB_PASS=quest \\\n  --dry-run=client -o yaml | kubectl\
    \ apply -f -\n  \nkubectl create secret generic crdb-data \\\n  --from-literal=username=admin\
    \ \\\n  --from-literal=password=quest \\\n  --from-literal=METRICSDB_USER=admin\
    \ \\\n  --from-literal=METRICSDB_PASS=quest \\\n  --dry-run=client -o yaml | kubectl\
    \ apply -f -\n\nkubectl create secret generic kfk-kpi-data \\\n  --from-literal=METRICSDB_USER=admin\
    \ \\\n  --from-literal=METRICSDB_PASS=quest \\\n  --dry-run=client -o yaml | kubectl\
    \ apply -f -\n\nkubectl create secret generic nats-data \\\n  --from-literal=username=admin\
    \ \\\n  --from-literal=password=quest \\\n  --dry-run=client -o yaml | kubectl\
    \ apply -f -\n   \nkubectl create secret docker-registry regcred \\\n  --docker-server=labs.etsi.org:5050\
    \ \\\n  --docker-username=antigravity \\\n  --docker-password=\"$$GITLAB_PAT\"\
    \ \\\n  --dry-run=client -o yaml | kubectl apply -f -\n\necho \"[VAULT] Mission\
    \ Success: Secrets established in-cluster.\"\n"
substitutions:
  _CLUSTER_NAME: REPLACE_ME
  _REGION: us-central1
