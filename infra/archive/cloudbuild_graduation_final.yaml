steps:
- name: gcr.io/cloud-builders/docker
  id: foundation
  entrypoint: bash
  args:
  - -c
  - "set -ex\nREGISTRY=\"${_CUSTOMER_REGISTRY}\"\
    \n\necho \"[FOUNDATION] Birthing Python-Base (Tag: 2026-04-21)...\"\ncat <<'EOF'\
    \ > Dockerfile.base\nFROM python:3.10-slim\n# [PHASE 7.57] Source-Based Reconciliation\
    \ (libyang v2)\nRUN apt-get update && apt-get install -y --no-install-recommends\
    \ \\\n    build-essential git libssl-dev libffi-dev python3-dev \\\n    cmake\
    \ libpcre2-dev && \\\n    rm -rf /var/lib/apt/lists/*\n    \nRUN git clone https://github.com/CESNET/libyang.git\
    \ && \\\n    cd libyang && git checkout v2.1.128 && \\\n    mkdir build && cd\
    \ build && \\\n    cmake -D CMAKE_INSTALL_PREFIX:PATH=/usr .. && \\\n    make\
    \ -j$(nproc) && make install && \\\n    ldconfig\n\n# [PHASE 7.53] Manifest-Based\
    \ Dependency Ingestion\nWORKDIR /var/teraflow\nCOPY baseline/tfs-controller/src/common/requirements_unified.in\
    \ /var/teraflow/common/\nRUN echo \"deepdiff\" >> /var/teraflow/common/requirements_unified.in\
    \ && \\\n    echo \"requests\" >> /var/teraflow/common/requirements_unified.in\
    \ && \\\n    echo \"pyyaml\" >> /var/teraflow/common/requirements_unified.in &&\
    \ \\\n    echo \"geopy\" >> /var/teraflow/common/requirements_unified.in && \\\
    \n    echo \"paramiko\" >> /var/teraflow/common/requirements_unified.in && \\\n\
    \    echo \"pandas\" >> /var/teraflow/common/requirements_unified.in && \\\n \
    \   echo \"matplotlib\" >> /var/teraflow/common/requirements_unified.in && \\\n\
    \    echo \"ncclient\" >> /var/teraflow/common/requirements_unified.in && \\\n\
    \    echo \"netifaces\" >> /var/teraflow/common/requirements_unified.in && \\\n\
    \    echo \"onnxruntime\" >> /var/teraflow/common/requirements_unified.in && \\\
    \n    echo \"pydantic\" >> /var/teraflow/common/requirements_unified.in && \\\n\
    \    echo \"pygnmi\" >> /var/teraflow/common/requirements_unified.in && \\\n \
    \   echo \"tabulate\" >> /var/teraflow/common/requirements_unified.in && \\\n\
    \    echo \"yattag\" >> /var/teraflow/common/requirements_unified.in && \\\n \
    \   echo \"websockets\" >> /var/teraflow/common/requirements_unified.in && \\\n\
    \    echo \"elasticsearch\" >> /var/teraflow/common/requirements_unified.in &&\
    \ \\\n    echo \"confluent-kafka\" >> /var/teraflow/common/requirements_unified.in\
    \ && \\\n    echo \"deepmerge\" >> /var/teraflow/common/requirements_unified.in\
    \ && \\\n    echo \"cryptography\" >> /var/teraflow/common/requirements_unified.in\
    \ && \\\n    echo \"scikit-learn\" >> /var/teraflow/common/requirements_unified.in\
    \ && \\\n    echo \"flask-httpauth\" >> /var/teraflow/common/requirements_unified.in\
    \ && \\\n    echo \"netaddr\" >> /var/teraflow/common/requirements_unified.in\
    \ && \\\n    echo \"pyang\" >> /var/teraflow/common/requirements_unified.in &&\
    \ \\\n    echo \"pyangbind\" >> /var/teraflow/common/requirements_unified.in &&\
    \ \\\n    pip install --no-cache-dir -r /var/teraflow/common/requirements_unified.in\n\
    \n# [SPEC] Ingesting Total Inter-Service Client Fabric\nCOPY baseline/tfs-controller/proto/\
    \ /var/teraflow/proto/\nCOPY baseline/tfs-controller/src/ /var/teraflow/src_tmp/\n\
    \n# [PHASE 7.63] Deep Client Ingestion (Total Mesh Saturation)\n# We hunt for\
    \ all client directories (excluding common) and anchor them to their service root.\n\
    RUN find /var/teraflow/src_tmp -type d -name \"client\" ! -path \"*/common/*\"\
    \ | while read client_dir; do \\\n      service_root=$(dirname \"$client_dir\"\
    ); \\\n      while [ \"$(basename $(dirname \"$service_root\"))\" != \"src_tmp\"\
    \ ] && [ \"$service_root\" != \"/var/teraflow/src_tmp\" ]; do \\\n        service_root=$(dirname\
    \ \"$service_root\"); \\\n      done; \\\n      service_name=$(basename \"$service_root\"\
    ); \\\n      dest_dir=\"/var/teraflow/$service_name/$(echo \"$client_dir\" | sed\
    \ \"s|.*$service_name/||\")\"; \\\n      mkdir -p \"$dest_dir\"; \\\n      cp\
    \ -r \"$client_dir/.\" \"$dest_dir/\"; \\\n      # Anchor all intermediate namespaces\n\
    \      curr_dir=\"$dest_dir\"; \\\n      while [ \"$curr_dir\" != \"/var/teraflow\"\
    \ ] && [ \"$curr_dir\" != \"/\" ]; do \\\n        touch \"$curr_dir/__init__.py\"\
    ; \\\n        curr_dir=$(dirname \"$curr_dir\"); \\\n      done; \\\n    done\
    \ && \\\n    cp -r /var/teraflow/src_tmp/common/* /var/teraflow/common/ && \\\n\
    \    rm -rf /var/teraflow/src_tmp && \\\n    touch /var/teraflow/common/__init__.py\n\
    \n# [PHASE 7.51] Code Generation Recovery (The Kill Shot)\nRUN rm -rf /var/teraflow/common/proto\
    \ && mkdir -p /var/teraflow/common/proto && \\\n    python3 -m grpc_tools.protoc\
    \ -I/var/teraflow/proto --python_out=/var/teraflow/common/proto \\\n    --grpc_python_out=/var/teraflow/common/proto\
    \ /var/teraflow/proto/*.proto && \\\n    find /var/teraflow/common/proto -type\
    \ f -name \"*_pb2*.py\" -exec sed -i -E 's/^import ([^ ]*)_pb2/from . import \\\
    1_pb2/g' {} + && \\\n    touch /var/teraflow/common/proto/__init__.py /var/teraflow/common/__init__.py\n\
    \    \n# [PHASE 7.74] Final Component Ingestion (Load Generator)\nRUN mkdir -p\
    \ /var/teraflow/load_generator\nCOPY baseline/tfs-controller/src/load_generator/\
    \ /var/teraflow/load_generator/\n\n# [PHASE 7.66] Total Namespace Saturation\n\
    RUN find /var/teraflow -type d -exec touch {}/__init__.py \\;\nRUN echo \"[DEBUG]\
    \ Gold Master Structure:\" && find /var/teraflow -maxdepth 3\n\nWORKDIR /var/teraflow\n\
    ENV PYTHONPATH=/var/teraflow\nEOF\n\ndocker build -t \"$${REGISTRY}/python-base:$_TAG\"\
    \ -f Dockerfile.base .\ndocker push \"$${REGISTRY}/python-base:$_TAG\"\n"
- name: gcr.io/cloud-builders/docker
  id: forge-context
  waitFor:
  - foundation
  entrypoint: bash
  args:
  - -c
  - sed -i "1s|.*|FROM ${_CUSTOMER_REGISTRY}/python-base:$_TAG|"
    baseline/tfs-controller/src/context/Dockerfile && docker build -t ${_CUSTOMER_REGISTRY}/contextservice:$_TAG
    -f baseline/tfs-controller/src/context/Dockerfile baseline/tfs-controller/
