    baseline/tfs-controller/src/telemetry/backend/Dockerfile && docker build -t ${_CUSTOMER_REGISTRY}/telemetry-backend:$_TAG
    -f baseline/tfs-controller/src/telemetry/backend/Dockerfile baseline/tfs-controller/
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: induction
  waitFor:
  - forge-context
  - forge-device
  - forge-service
  - forge-slice
  - forge-pathcomp
  - forge-monitoring
  - forge-automation
  - forge-webui
  - forge-nbi
  - forge-analytics-frontend
  - forge-analytics-backend
  - forge-telemetry-frontend
  - forge-telemetry-backend
  entrypoint: bash
  args:
  - -c
  - "set -ex\necho \"[DEPLOY] Authenticating to Hardened Cottage: $_CLUSTER_NAME...\"\
    \ngcloud container clusters get-credentials \"$_CLUSTER_NAME\" --zone \"$_ZONE\"\
    \ --project \"$PROJECT_ID\"\n\nREGISTRY=\"${_CUSTOMER_REGISTRY}\"\
    \n\nCOMPONENTS=(\n    \"context:contextservice.yaml\"\n    \"device:deviceservice.yaml\"\
    \n    \"service:serviceservice.yaml\"\n    \"slice:sliceservice.yaml\"\n    \"\
    pathcomp:pathcompservice.yaml\"\n    \"nbi:nbiservice.yaml\"\n    \"webui:webuiservice.yaml\"\
    \n    \"monitoring:monitoringservice.yaml\"\n    \"automation:automationservice.yaml\"\
    \n    \"analytics-frontend:analyticsservice.yaml\" \"analytics-backend:analyticsservice.yaml\"\
    \n    \"telemetry-frontend:telemetryservice.yaml\"\n    \"telemetry-backend:telemetryservice.yaml\"\
    \n)\n\n# [PHASE 7.XX] Birthing Manifest Hardener (Architectural Truth Orchestrator)\n\
    # Installing PyYAML for structural integrity (Overriding PEP 668 for ephemeral\
    \ env)\npip3 install --user PyYAML --break-system-packages\n\ncat <<'EOF' | sed\
    \ 's/^      //' > harden_manifest.py\nimport sys, yaml\n\ndef harden():\n    if\
    \ len(sys.argv) < 5:\n        sys.exit(1)\n    file_path, service_name, tag, registry\
    \ = sys.argv[1:]\n    try:\n        with open(file_path, 'r') as f:\n        \
    \    data = list(yaml.load_all(f, Loader=yaml.FullLoader))\n        for doc in\
    \ data:\n            if not doc or 'kind' not in doc:\n                continue\n\
    \            if doc['kind'] in ['Deployment', 'StatefulSet']:\n              \
    \  for container in doc['spec']['template']['spec']['containers']:\n         \
    \           container['image'] = f\"{registry}/{service_name}:{tag}\"\n      \
    \              container['imagePullPolicy'] = 'Always'\n        with open(file_path,\
    \ 'w') as f:\n            yaml.dump_all(data, f)\n    except Exception as e:\n\
    \        sys.exit(1)\n\nif __name__ == \"__main__\":\n    harden()\nEOF\n\necho\
    \ \"[INDUCTION] Creating Orchestration Secrets...\"\nkubectl create secret generic\
    \ kfk-kpi-data --from-literal=KFK_SERVER_ADDRESS=kafka-public.default.svc.cluster.local:9092\
    \ --from-literal=KAFKA_API_VERSION=3.7.0 --dry-run=client -o yaml | kubectl apply\
    \ -f -\nkubectl create secret generic qdb-data --from-literal=username=admin --from-literal=password=quest\
    \ --from-literal=METRICSDB_USER=admin --from-literal=METRICSDB_PASS=quest --from-literal=METRICSDB_HOSTNAME=questdb-public\
    \ --dry-run=client -o yaml | kubectl apply -f -\nkubectl create secret generic\
    \ crdb-data --from-literal=CRDB_USERNAME=admin --from-literal=CRDB_PASSWORD=quest\
    \ --from-literal=CRDB_DATABASE=tfs_context --from-literal=CRDB_NAMESPACE=default\
    \ --dry-run=client -o yaml | kubectl apply -f -\nkubectl create secret generic\
    \ nats-data --from-literal=NATS_USERNAME=admin --from-literal=NATS_PASSWORD=quest\
    \ --dry-run=client -o yaml | kubectl apply -f -\n\necho \"[INDUCTION] Executing\
    \ Terminal Induction (Universal Tag: $_TAG)...\"\n\necho \"[BACKBONE] Purging\
    \ Ghost Resources...\"\nkubectl delete statefulset kafka questdb --ignore-not-found=true\n\
    kubectl delete service kafka-public questdb-public --ignore-not-found=true\n\n\
    echo \"[BACKBONE] Inducing Fresh Persistence Fabric...\"\nsed -i 's/kafka-public.kafka.svc.cluster.local/kafka-public.default.svc.cluster.local/'\
    \ baseline/tfs-controller/manifests/kafka/single-node.yaml\nkubectl apply -f infra/storage-class-hardened.yaml\n\
    kubectl apply -f baseline/tfs-controller/manifests/cockroachdb/crds.yaml\nkubectl\
    \ wait --for=condition=established --timeout=60s crd/crdbclusters.crdb.cockroachlabs.com\n\
    kubectl apply -f baseline/tfs-controller/manifests/cockroachdb/operator.yaml\n\
    kubectl rollout status deployment/cockroach-operator-manager -n cockroach-operator-system\
    \ --timeout=120s\nsleep 10\nkubectl apply -f baseline/tfs-controller/manifests/cockroachdb/cluster.yaml\n\
    kubectl apply -f baseline/tfs-controller/manifests/nats/nats_fidelity.yaml\nkubectl\
    \ apply -f baseline/tfs-controller/manifests/kafka/single-node.yaml\nkubectl apply\
    \ -f baseline/tfs-controller/manifests/questdb/manifest.yaml\n\nsleep 30\n\nfor\
    \ COMP_DATA in \"${COMPONENTS[@]}\"; do\n    IFS=':' read -r S_NAME MANIFEST_FILE\
    \ <<< \"$$COMP_DATA\"\n    MANIFEST=\"baseline/tfs-controller/manifests/$$MANIFEST_FILE\"\
    \n    if [ ! -f \"$$MANIFEST\" ]; then continue; fi\n    \n    python3 harden_manifest.py\
    \ \"$$MANIFEST\" \"$$S_NAME\" \"$_TAG\" \"$_REGISTRY\"\n    \n    echo \"[INDUCTION]\
    \ Inducing $$S_NAME onto cluster...\"\n    kubectl apply -f \"$$MANIFEST\"\ndone\n\
    \necho \"[GATEWAY] Inducting NGINX Ingress...\"\nkubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/cloud/deploy.yaml\n\
    sleep 60\nkubectl apply -f infra/tfs_ingress.yaml\necho \"[GRADUATION] Mission\
    \ Success.\"\n"
options:
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE
substitutions:
  _CLUSTER_NAME: sovereign-genesis
  _ZONE: us-central1-a
  _TAG: rc13-verified
  _REGISTRY: ${_CUSTOMER_REGISTRY}
