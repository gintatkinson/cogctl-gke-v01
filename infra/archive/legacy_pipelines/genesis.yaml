steps:
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: setup-network
  entrypoint: bash
  args:
  - -c
  - "set -ex\nVPC_NAME=\"sovereign-vpc-${_ID}\"\nSUBNET_NAME=\"sovereign-subnet-${_ID}\"\
    \n\necho \"[STAGE 3] Building Immutable VPC: $$VPC_NAME...\"\ngcloud compute networks\
    \ create \"$$VPC_NAME\" \\\n    --subnet-mode=custom \\\n    --project=\"${PROJECT_ID}\"\
    \n\necho \"[STAGE 4] Building Subnet Fabric...\"\ngcloud compute networks subnets\
    \ create \"$$SUBNET_NAME\" \\\n    --network=\"$$VPC_NAME\" \\\n    --range=10.10.0.0/24\
    \ \\\n    --secondary-range=gke-pods=10.100.0.0/16,gke-services=10.101.0.0/20\
    \ \\\n    --region=\"${_REGION}\" \\\n    --enable-private-ip-google-access \\\
    \n    --project=\"${PROJECT_ID}\"\n"
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: setup-egress
  waitFor:
  - setup-network
  entrypoint: bash
  args:
  - -c
  - "set -ex\nVPC_NAME=\"sovereign-vpc-${_ID}\"\nROUTER_NAME=\"sovereign-router-${_ID}\"\
    \nNAT_NAME=\"sovereign-nat-${_ID}\"\n\necho \"[STAGE 5] Provisioning Cloud NAT...\"\
    \ngcloud compute routers create \"$$ROUTER_NAME\" \\\n    --network=\"$$VPC_NAME\"\
    \ \\\n    --region=\"${_REGION}\" \\\n    --project=\"${PROJECT_ID}\"\n\ngcloud\
    \ compute routers nats create \"$$NAT_NAME\" \\\n    --router=\"$$ROUTER_NAME\"\
    \ \\\n    --region=\"${_REGION}\" \\\n    --auto-allocate-nat-external-ips \\\n\
    \    --nat-all-subnet-ip-ranges \\\n    --project=\"${PROJECT_ID}\"\n"
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: setup-firewall
  waitFor:
  - setup-network
  entrypoint: bash
  args:
  - -c
  - "set -ex\nVPC_NAME=\"sovereign-vpc-${_ID}\"\n\necho \"[STAGE 7] Establishing Security\
    \ Perimeter...\"\ngcloud compute firewall-rules create \"sovereign-allow-internal-${_ID}\"\
    \ \\\n    --network=\"$$VPC_NAME\" \\\n    --allow=tcp,udp,icmp \\\n    --source-ranges=10.10.0.0/16\
    \ \\\n    --project=\"${PROJECT_ID}\"\n\ngcloud compute firewall-rules create\
    \ \"sovereign-allow-public-web-${_ID}\" \\\n    --network=\"$$VPC_NAME\" \\\n\
    \    --allow=tcp:80,tcp:443 \\\n    --source-ranges=0.0.0.0/0 \\\n    --project=\"\
    ${PROJECT_ID}\"\n"
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: setup-cluster
  waitFor:
  - setup-egress
  - setup-firewall
  entrypoint: bash
  args:
  - -c
  - "set -ex\nVPC_NAME=\"sovereign-vpc-${_ID}\"\nSUBNET_NAME=\"sovereign-subnet-${_ID}\"\
    \nCLUSTER_NAME=\"sovereign-genesis-${_ID}\"\n\necho \"[STAGE 8] Ignition - Creating\
    \ Hardened Zonal Cluster...\"\ngcloud container clusters create \"$$CLUSTER_NAME\"\
    \ \\\n    --zone \"${_REGION}-a\" \\\n    --num-nodes 1 \\\n    --machine-type\
    \ e2-standard-4 \\\n    --disk-size 50GB \\\n    --network \"$$VPC_NAME\" \\\n\
    \    --subnetwork \"$$SUBNET_NAME\" \\\n    --cluster-secondary-range-name gke-pods\
    \ \\\n    --services-secondary-range-name gke-services \\\n    --enable-ip-alias\
    \ \\\n    --project=\"${PROJECT_ID}\"\n"
substitutions:
  _ID: manual
  _REGION: us-central1
options:
  logging: CLOUD_LOGGING_ONLY
