steps:
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
  - -c
  - "set -e\necho \"[PATCH] Authenticating to cluster: $_CLUSTER_NAME...\"\ngcloud\
    \ container clusters get-credentials \"$_CLUSTER_NAME\" --region \"$_REGION\"\n\
    \nCOMPONENTS=(\n  \"contextservice\"\n  \"deviceservice\"\n  \"serviceservice\"\
    \n  \"sliceservice\"\n  \"nbiservice\"\n  \"webuiservice\"\n  \"monitoringservice\"\
    \n  \"automationservice\"\n)\n\necho \"[PATCH] APPLYING RELAXATION PATCH (High-Timeout\
    \ Probes)...\"\nfor COMP in \"${COMPONENTS[@]}\"; do\n  echo \"Patching $$COMP...\"\
    \n  # Replace sidecar probes with long-timeout variants to bridge Autopilot latency\n\
    \  RELAX_PROBE='{\"initialDelaySeconds\": 300, \"periodSeconds\": 10, \"timeoutSeconds\"\
    : 5, \"failureThreshold\": 30, \"tcpSocket\": {\"port\": 80}}'\n  kubectl patch\
    \ deployment \"$$COMP\" --type='json' -p=\"[\n    {\\\"op\\\": \\\"replace\\\"\
    , \\\"path\\\": \\\"/spec/template/spec/containers/1/readinessProbe\\\", \\\"\
    value\\\": $$RELAX_PROBE},\n    {\\\"op\\\": \\\"replace\\\", \\\"path\\\": \\\
    \"/spec/template/spec/containers/1/livenessProbe\\\", \\\"value\\\": $$RELAX_PROBE}\n\
    \  ]\" --namespace=default || echo \"Warning: Could not patch $$COMP (maybe no\
    \ sidecar?)\"\ndone\n\necho \"[PATCH] Verification of Pod Readiness...\"\nkubectl\
    \ get pods -A\n"
substitutions:
  _CLUSTER_NAME: REPLACE_ME
  _REGION: us-central1
