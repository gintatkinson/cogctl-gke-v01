steps:
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: validate-substitutions
  entrypoint: bash
  args:
  - -c
  - "echo 'Ignition Validated for: ${_CUSTOMER_PROJECT_ID} | ${_CUSTOMER_REGISTRY} | ${_TARGET_REGION} | ${_TARGET_ZONE} | ${_REGION} | ${_ZONE} | ${_CLUSTER_NAME} | ${_NAMESPACE}'"
- name: hashicorp/terraform:1.5.0
  id: terraform-ignition
  entrypoint: sh
  args:
  - -c
  - "set -ex\ncd infra/terraform\nterraform init -upgrade\nterraform apply -auto-approve\
    \ \\\n  -var=\"project_id=${PROJECT_ID}\" \\\n  -var=\"cluster_name=${_CLUSTER_NAME}\"\
    \ \\\n  -var=\"region=${_REGION}\" \\\n  -var=\"zone=${_ZONE}\"\n"
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: wait-for-foundation
  waitFor:
  - terraform-ignition
  entrypoint: bash
  args:
  - -c
  - |
    set -ex
    gcloud container clusters get-credentials "${_CLUSTER_NAME}" --zone "${_ZONE}" --project "${PROJECT_ID}"
    echo "[IGNITION] Waiting for cluster nodes..."
    for i in {1..20}; do
      if kubectl get nodes | grep -q " Ready"; then
        echo "[SUCCESS] Cluster is responsive."
        exit 0
      fi
      echo "Waiting for nodes... ($i/20)"
      sleep 15
    done
    exit 1
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: sanitize-environment
  waitFor:
  - wait-for-foundation
  entrypoint: bash
  args:
  - -c
  - |
    set -ex
    gcloud container clusters get-credentials "${_CLUSTER_NAME}" --zone "${_ZONE}" --project "${PROJECT_ID}"
    echo "[IGNITION] Performing Tabula Rasa Sanitization of ${_NAMESPACE}..."
    kubectl delete namespace "${_NAMESPACE}" --ignore-not-found=true

    # Wait for termination to complete
    for i in {1..20}; do
      if ! kubectl get namespace "${_NAMESPACE}"; then
        echo "[CLEAN] Environment sanitized."
        break
      fi
      echo "Waiting for namespace cleanup... ($i/20)"
      sleep 10
    done
    echo "[IGNITION] Recreating Sovereign Namespace..."
    kubectl create namespace "${_NAMESPACE}"
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: induct-secrets
  waitFor:
  - sanitize-environment
  entrypoint: bash
  args:
  - -c
  - |
    set -ex
    gcloud container clusters get-credentials "${_CLUSTER_NAME}" --zone "${_ZONE}" --project "${PROJECT_ID}"
    echo "[IGNITION] Inducting Declarative Secrets (SOP-05)..."
    kubectl apply -f baseline/tfs-controller/manifests/graduation_secrets.yaml
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: induct-backbone
  waitFor:
  - induct-secrets
  entrypoint: bash
  args:
  - -c
  - |
    set -ex
    gcloud container clusters get-credentials "${_CLUSTER_NAME}" --zone "${_ZONE}" --project "${PROJECT_ID}"
    echo "[IGNITION] Inducting Hardened Persistence Fabric from Baseline..."

    # [SOP-07] Pre-requisite Storage Class Induction (SOP-01)
    kubectl apply -f infra/storage-class-hardened.yaml

    # [SOP-08] Deterministic Backbone Induction
    echo "[IGNITION] Inducting Cert-Manager (Webhook TLS Provider)..."
    kubectl apply -f baseline/tfs-controller/manifests/cert-manager/operator.yaml
    kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=300s

    kubectl apply -f baseline/tfs-controller/manifests/cockroachdb/crds.yaml
    kubectl apply -f baseline/tfs-controller/manifests/cockroachdb/operator.yaml

    echo "Waiting for Cockroach Operator Readiness (SOP-03)..."
    kubectl rollout status deployment/cockroach-operator-manager -n cockroach-operator-system --timeout=300s

    # [SPEC: Orchestration Race Condition] - Mandatory settling delay to avoid webhook deadlocks
    echo "[IGNITION] Webhook Settling (30s)..."
    sleep 30

    kubectl apply -f baseline/tfs-controller/manifests/cockroachdb/cluster.yaml -n "${_NAMESPACE}"
    kubectl apply -f baseline/tfs-controller/manifests/nats/nats_fidelity.yaml -n "${_NAMESPACE}"
    kubectl apply -f baseline/tfs-controller/manifests/kafka/single-node.yaml -n "${_NAMESPACE}"
    kubectl apply -f baseline/tfs-controller/manifests/questdb/manifest.yaml -n "${_NAMESPACE}"
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: induct-services
  waitFor:
  - induct-backbone
  entrypoint: bash
  args:
  - -c
  - |
    set -ex
    gcloud container clusters get-credentials "${_CLUSTER_NAME}" --zone "${_ZONE}" --project "${PROJECT_ID}"
    echo "[IGNITION] Running Hydration Engine..."
    python3 scripts/hydrate_blueprints.py "${_CUSTOMER_REGISTRY}" "${_CUSTOMER_PROJECT_ID}"
    echo "[IGNITION] Inducting Application Services (Hydrated)..."
    kubectl apply -f baseline/tfs-controller/manifests/ -n "${_NAMESPACE}"
    kubectl apply -f infra/tfs_ingress.yaml -n "${_NAMESPACE}"
    echo "[SUCCESS] Sovereign Enclave is operational."
substitutions:
  _CLUSTER_NAME: sovereign-genesis
  _CUSTOMER_PROJECT_ID: CUSTOMER_PROJECT_ID_PLACEHOLDER
  _CUSTOMER_REGISTRY: us-central1-docker.pkg.dev/CUSTOMER_PROJECT_ID_PLACEHOLDER/sovereign-tfs
  _NAMESPACE: sovereign-genesis
  _REGION: us-central1
  _TARGET_REGION: us-central1
  _TARGET_ZONE: us-central1-a
  _ZONE: us-central1-a
timeout: 3600s
options:
  logging: CLOUD_LOGGING_ONLY
